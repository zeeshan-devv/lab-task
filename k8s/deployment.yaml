apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lab-app-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-app
  template:
    metadata:
      labels:
        app: lab-app
    spec:
      containers:
        - name: lab-app
          image: IMAGE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: lab-app-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: lab-app
spec:
  type: NodePort
  selector:
    app: lab-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007
